name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/ndk/25.2.9519653" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          else
            latest_ndk=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
            if [ -n "$latest_ndk" ]; then
              echo "ANDROID_NDK_HOME=$latest_ndk" >> $GITHUB_ENV
            else
              $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
            fi
          fi

      - name: Build APK with Gradle
        working-directory: android
        run: |
          if ! gradle assembleRelease --no-daemon --stacktrace > ../gradle_build.log 2>&1; then
            echo "::error::=== LAST 30 LINES ==="
            tail -n 30 ../gradle_build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::=== COMPILER ERRORS ==="
            grep -i -C 2 -E "error:|fatal error:" ../gradle_build.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Stage APK Output
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/FlappyBird-SunsetArcade.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Android-APK
          path: output/FlappyBird-SunsetArcade.apk
          retention-days: 30

      - name: Commit and Push Built APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp output/FlappyBird-SunsetArcade.apk apk/FlappyBird-SunsetArcade.apk
          git add apk/FlappyBird-SunsetArcade.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(apk): update FlappyBird-SunsetArcade.apk with compiled native binaries [skip ci]" && git push origin main)

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Flappy Bird Sunset Arcade v1.0.1"
          draft: false
          prerelease: false
          files: output/FlappyBird-SunsetArcade.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
