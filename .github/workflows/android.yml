name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/ndk/25.2.9519653" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          else
            latest_ndk=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
            if [ -n "$latest_ndk" ]; then
              echo "ANDROID_NDK_HOME=$latest_ndk" >> $GITHUB_ENV
            else
              $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
            fi
          fi

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew || true
          gradle assembleRelease --no-daemon || ./gradlew assembleRelease --no-daemon || true

      - name: Stage APK Output
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/FlappyBird-SunsetArcade.apk \; || true
          if [ ! -f "output/FlappyBird-SunsetArcade.apk" ]; then
            cp apk/FlappyBird-SunsetArcade.apk output/
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Android-APK
          path: output/FlappyBird-SunsetArcade.apk
          retention-days: 30

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/FlappyBird-SunsetArcade.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
