plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thedreadlorddeath.flappybird'
    compileSdk 34

    defaultConfig {
        applicationId "com.thedreadlorddeath.flappybird"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file("../keystore/release.keystore")
            storePassword "flappybird123"
            keyAlias "flappybird"
            keyPassword "flappybird123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    androidResources {
        noCompress 'ttf'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/com/android/build/gradle/app-metadata.properties',
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES'
            ]
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FlappyBird-SunsetArcade.apk"
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1+"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure C++ NativeActivity requires no external Java dependencies
}
